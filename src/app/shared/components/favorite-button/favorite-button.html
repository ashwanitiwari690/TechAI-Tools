<button
  type="button"
  class="fav-btn"
  [class.is-active]="active()"
  (click)="toggle($event)"
  [attr.aria-pressed]="active()"
  [attr.aria-label]="active() ? 'Remove ' + name() + ' from favorites' : 'Add ' + name() + ' to favorites'"
>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path
      d="M12 20.7l-1.5-1.4C5.4 14.6 2 11.5 2 7.9 2 5.1 4.2 3 6.9 3c1.6 0 3.1.8 4.1 2 .9-1.2 2.5-2 4.1-2 2.7 0 4.9 2.1 4.9 4.9 0 3.6-3.4 6.7-8.5 11.4L12 20.7z"
    />
  </svg>
</button>
