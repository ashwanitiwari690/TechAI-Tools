<button type="button" class="copy-btn" (click)="copy()" [attr.aria-label]="label()">
  @if (copied()) {
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Copied</span>
  } @else {
    <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="6" y="6" width="10" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 12.5V4.5A1.5 1.5 0 0 1 5.5 3h7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    <span>{{ label() }}</span>
  }
</button>
