<div class="dropdown">
  <button
    type="button"
    class="dropdown__trigger"
    (click)="toggle()"
    [attr.aria-expanded]="open()"
    aria-haspopup="listbox"
  >
    <span class="dropdown__trigger-label">{{ label() }}:</span>
    <span class="dropdown__trigger-value">{{ selectedLabel }}</span>
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 7.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  @if (open()) {
    <ul class="dropdown__menu" role="listbox">
      @for (option of options(); track option.value) {
        <li>
          <button
            type="button"
            class="dropdown__option"
            [class.is-selected]="option.value === selectedValue()"
            role="option"
            [attr.aria-selected]="option.value === selectedValue()"
            (click)="select(option)"
          >
            {{ option.label }}
          </button>
        </li>
      }
    </ul>
  }
</div>
