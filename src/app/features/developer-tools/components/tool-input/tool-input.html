<div class="tool-field">
  <div class="tool-field__head">
    <label [for]="label()">{{ label() }}</label>
    <div class="tool-field__actions">
      @if (hasExample()) {
        <button type="button" (click)="loadExample.emit()">Load example</button>
      }
      <button type="button" (click)="clear()">Clear</button>
    </div>
  </div>
  <textarea
    [id]="label()"
    [rows]="rows()"
    [placeholder]="placeholder()"
    [(ngModel)]="value"
    spellcheck="false"
  ></textarea>
</div>
