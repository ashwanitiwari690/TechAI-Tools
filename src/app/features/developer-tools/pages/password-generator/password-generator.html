<app-tool-layout
  title="Password Generator"
  description="Generate strong, random passwords with full control over length and character types."
  whatIsIt="This tool creates random passwords using a cryptographically secure random number generator, with options to control length and which character types are included."
  howItWorks="It uses the Web Crypto API's getRandomValues to pick random characters from your chosen character pool, entirely in your browser."
  [howToUse]="howToUse"
  [example]="example"
  [useCases]="useCases"
  [benefits]="benefits"
  [limitations]="limitations"
  [faq]="faq"
  [relatedTools]="relatedTools"
>
  <div class="tool-controls">
    <label>
      Length: {{ length() }}
      <input type="number" min="4" max="128" [value]="length()" (change)="setLength($any($event.target).value)" />
    </label>
    <label><input type="checkbox" [checked]="includeUpper()" (change)="includeUpper.set(!includeUpper())" /> Uppercase</label>
    <label><input type="checkbox" [checked]="includeLower()" (change)="includeLower.set(!includeLower())" /> Lowercase</label>
    <label><input type="checkbox" [checked]="includeDigits()" (change)="includeDigits.set(!includeDigits())" /> Numbers</label>
    <label><input type="checkbox" [checked]="includeSymbols()" (change)="includeSymbols.set(!includeSymbols())" /> Symbols</label>
    <label><input type="checkbox" [checked]="excludeAmbiguous()" (change)="excludeAmbiguous.set(!excludeAmbiguous())" /> Exclude ambiguous characters</label>
  </div>

  <div class="tool-controls">
    <button type="button" class="tool-generate-btn" (click)="generate()">Generate password</button>
    <app-badge [tone]="strength().tone">{{ strength().label }}</app-badge>
  </div>

  <div class="tool-field__result password-result">
    <pre>{{ password() || 'Select at least one character type.' }}</pre>
    <app-copy-button [text]="password()" />
  </div>
</app-tool-layout>
