<app-card [interactive]="true" class="tool-card">
  <a [routerLink]="['/ai-tools', tool().slug]" class="tool-card__link">
    <div class="tool-card__top">
      <span class="tool-card__logo" aria-hidden="true">{{ tool().logoInitials }}</span>
      <div class="tool-card__heading">
        <h3>{{ tool().name }}</h3>
        <app-rating [value]="tool().rating" [reviewCount]="tool().reviewCount" />
      </div>
    </div>

    <p class="tool-card__desc">{{ tool().shortDescription }}</p>

    <div class="tool-card__tags">
      <app-badge tone="primary">{{ tool().category }}</app-badge>
      <app-badge>{{ tool().pricing }}</app-badge>
    </div>
  </a>

  <div class="tool-card__footer">
    <app-favorite-button type="ai-tool" [slug]="tool().slug" [name]="tool().name" />
    <a [routerLink]="['/ai-tools', tool().slug]" class="tool-card__cta">Explore &rarr;</a>
  </div>
</app-card>
